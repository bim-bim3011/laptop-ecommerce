<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LapZone - Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Hanken+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#585e6e",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed": "#151c29",
                        "surface": "#f7f9fb",
                        "tertiary": "#735c00",
                        "surface-dim": "#d8dadc",
                        "inverse-primary": "#c0c6d8",
                        "on-primary-container": "#7d8494",
                        "on-surface-variant": "#45474c",
                        "error": "#ba1a1a",
                        "primary": "#000000",
                        "primary-container": "#151c29",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-surface": "#191c1e",
                        "tertiary-container": "#cea700",
                        "primary-fixed": "#dce2f5",
                        "on-secondary-fixed": "#001a42",
                        "on-primary-fixed-variant": "#404756",
                        "background": "#f7f9fb",
                        "secondary-fixed": "#d8e2ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#eec200",
                        "surface-container-low": "#f2f4f6",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed": "#ffe083",
                        "on-tertiary-fixed": "#231b00",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c6c6cc",
                        "on-secondary-fixed-variant": "#004395",
                        "on-secondary-container": "#fefcff",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-container": "#4e3e00",
                        "primary-fixed-dim": "#c0c6d8",
                        "surface-variant": "#e0e3e5",
                        "secondary-container": "#2170e4",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "outline": "#76777c",
                        "surface-container-high": "#e6e8ea",
                        "surface-container": "#eceef0",
                        "on-tertiary-fixed-variant": "#574500",
                        "secondary": "#0058be",
                        "surface-container-highest": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    }
                }
            }
        }
    </script>
<style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
    @keyframes slideInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in-up {
        animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
    .animate-float {
        animation: float 6s ease-in-out infinite;
    }
</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center relative overflow-hidden bg-grid">

    <!-- Decorative Elements -->
    <div class="absolute top-[-10%] left-[-5%] w-[40%] h-[50%] bg-secondary-fixed rounded-full blur-[100px] opacity-60 animate-float"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[30%] h-[40%] bg-tertiary-fixed rounded-full blur-[120px] opacity-40 animate-float" style="animation-delay: 2s;"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md relative z-10 animate-slide-in-up px-6">
        <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] overflow-hidden transition-all duration-300 hover:shadow-[0_30px_60px_-15px_rgba(0,0,0,0.15)]">
            
            <!-- Header -->
            <div class="p-8 pb-6 border-b border-outline-variant text-center bg-surface-container-low/50">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container text-on-primary-container mb-4 shadow-inner">
                    <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
                </div>
                <h1 class="font-headline-md text-3xl font-bold text-primary mb-2">LapZone</h1>
                <p class="text-on-surface-variant font-label-md">Admin Workspace Access</p>
            </div>

            <!-- Form -->
            <div class="p-8 pt-6">
                <!-- Change action URL later to match your Spring Security mapping if needed -->
                <form action="/admin/login" method="post" class="space-y-5">
                    
                    <!-- Error Message -->
                    <div th:if="${error != null}" class="p-3 mb-4 text-sm text-on-error-container bg-error-container rounded-lg border border-error flex items-center gap-2 animate-fade-in-down">
                        <span class="material-symbols-outlined text-xl">error</span>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Email Field -->
                    <div class="space-y-1.5 group">
                        <label for="email" class="block font-label-md text-sm text-on-surface">Admin Email</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">mail</span>
                            <input type="email" id="email" name="email" required
                                class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all duration-300"
                                placeholder="admin@lapzone.com">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="space-y-1.5 group">
                        <div class="flex justify-between items-center">
                            <label for="password" class="block font-label-md text-sm text-on-surface">Password</label>
                            <a href="#" class="text-sm font-label-md text-secondary hover:text-secondary-container transition-colors hover:underline">Forgot?</a>
                        </div>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-secondary transition-colors">lock</span>
                            <input type="password" id="password" name="password" required
                                class="w-full pl-10 pr-10 py-3 bg-surface border border-outline-variant rounded-xl font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all duration-300"
                                placeholder="••••••••">
                            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none">
                                <span class="material-symbols-outlined text-xl">visibility_off</span>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary/50 bg-surface transition-all cursor-pointer">
                        <label for="remember" class="ml-2 font-body-md text-sm text-on-surface-variant cursor-pointer select-none">Remember my session</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                        class="w-full py-3 px-4 bg-primary text-on-primary rounded-xl font-label-md font-medium text-base hover:bg-primary-fixed-variant hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:shadow-md transition-all duration-300 flex justify-center items-center gap-2 group">
                        Authenticate
                        <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </button>
                </form>

                <!-- Footer -->
                <div class="mt-8 text-center text-xs text-on-surface-variant font-body-md">
                    <p>Protected by LapZone Security System</p>
                    <p class="mt-1">© 2026 LapZone Inc. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
