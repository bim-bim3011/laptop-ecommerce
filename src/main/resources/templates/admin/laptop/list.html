<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LapZone Admin – Laptop Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-gray-900 min-h-screen flex flex-col">

<div class="bg-[#2b313b] text-gray-300 text-xs py-2">
    <div class="max-w-[96%] w-full mx-auto px-4 flex justify-between items-center">
        <span class="text-white font-semibold flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            Admin Panel
        </span>
        <div class="flex gap-6 items-center">
            <a href="/admin/laptops" class="text-white font-semibold">Laptops</a>
            <a href="#" class="hover:text-white transition-colors">Categories</a>
            <a href="#" class="hover:text-white transition-colors">Brands</a>
            <a href="/" class="hover:text-white transition-colors flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
                View Store
            </a>
        </div>
    </div>
</div>

<header class="bg-white border-b border-gray-200 py-4 sticky top-0 z-[100]">
    <div class="max-w-[96%] w-full mx-auto px-4 flex items-center gap-3">
        <a href="/admin/laptops" class="flex items-center gap-2 text-xl font-extrabold tracking-wide text-gray-900">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"/>
                <rect x="9" y="9" width="6" height="6"/>
                <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
                <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
                <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/>
                <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>
            </svg>
            LapZone <span class="text-blue-500 ml-1">Admin</span>
        </a>
    </div>
</header>

<main class="flex-1 pb-12">
    <div class="max-w-[96%] w-full mx-auto px-4 py-8">

        <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
            <div>
                <p class="text-xs font-semibold uppercase tracking-widest text-gray-400 mb-1">Catalog</p>
                <h1 class="text-2xl font-extrabold text-gray-900">Laptop Management</h1>
            </div>
            <a th:href="@{/admin/laptops/new}"
               class="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add Laptop
            </a>
        </div>

        <div th:if="${message}"
             class="mb-5 flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span th:text="${message}"></span>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
            <form th:action="@{/admin/laptops}" method="get" class="flex gap-3">
                <div class="relative flex-1 max-w-md">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by laptop name..."
                           class="w-full pl-9 pr-4 py-2.5 border border-gray-200 rounded-full text-sm focus:outline-none focus:border-blue-500 focus:ring-[3px] focus:ring-blue-500/10 transition-all bg-white">
                </div>
                <button type="submit" class="px-5 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold rounded-full transition-colors">Search</button>
                <a th:if="${keyword != null and keyword != ''}" th:href="@{/admin/laptops}"
                   class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-full transition-colors">Clear</a>
            </form>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                <tr class="border-b border-gray-200 bg-slate-50">
                    <th class="text-left text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5 w-16">Image</th>
                    <th class="text-left text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5">Laptop Name</th>
                    <th class="text-left text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5">Category</th>
                    <th class="text-left text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5">Brand</th>
                    <th class="text-left text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5">Created At</th>
                    <th class="text-right text-xs font-bold uppercase tracking-wider text-gray-400 px-5 py-3.5">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${laptopPage.empty}">
                    <td colspan="6" class="text-center py-16 text-gray-400">
                        <svg class="w-10 h-10 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <p class="font-medium">No laptops found</p>
                        <p class="text-xs mt-1">Add your first laptop to get started.</p>
                    </td>
                </tr>
                <tr th:each="laptop : ${laptopPage.content}"
                    class="border-b border-gray-100 hover:bg-slate-50 transition-colors last:border-b-0">
                    <td class="px-5 py-3.5">
                        <div class="w-12 h-12 rounded-lg bg-slate-100 border border-gray-200 overflow-hidden flex items-center justify-center shrink-0">
                            <img th:if="${laptop.imageUrl != null}" th:src="${laptop.imageUrl}" class="w-full h-full object-cover" alt="">
                            <svg th:if="${laptop.imageUrl == null}" class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                    </td>
                    <td class="px-5 py-3.5 font-semibold text-gray-900" th:text="${laptop.laptopName}"></td>
                    <td class="px-5 py-3.5">
                        <span class="inline-block bg-blue-50 text-blue-600 text-xs font-semibold px-2.5 py-1 rounded-full"
                              th:text="${laptop.category != null ? laptop.category.categoryName : '—'}"></span>
                    </td>
                    <td class="px-5 py-3.5 text-gray-600" th:text="${laptop.brand != null ? laptop.brand.brandName : '—'}"></td>
                    <td class="px-5 py-3.5 text-gray-400 text-xs" th:text="${#temporals.format(laptop.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="px-5 py-3.5">
                        <div class="flex items-center justify-end gap-2">
                            <a th:href="@{/admin/laptops/view/{id}(id=${laptop.laptopId})}"
                               class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-gray-700 text-xs font-semibold rounded-md transition-colors">View</a>
                            <a th:href="@{/admin/laptops/edit/{id}(id=${laptop.laptopId})}"
                               class="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-semibold rounded-md transition-colors">Edit</a>
                            <form th:action="@{/admin/laptops/delete/{id}(id=${laptop.laptopId})}" method="post" class="inline"
                                  onsubmit="return confirm('Delete this laptop? This action cannot be undone.')">
                                <button type="submit" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold rounded-md transition-colors">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-center gap-1.5 mt-5" th:if="${laptopPage.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, laptopPage.totalPages - 1)}"
               th:href="@{/admin/laptops(page=${i}, keyword=${keyword})}"
               th:text="${i + 1}"
               th:class="${i == currentPage}
                   ? 'w-9 h-9 flex items-center justify-center rounded-full bg-blue-500 text-white text-sm font-bold'
                   : 'w-9 h-9 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-600 text-sm font-semibold hover:bg-gray-50 transition-colors'">
            </a>
        </div>

    </div>
</main>

<footer class="bg-slate-900 text-gray-400 py-5 mt-auto">
    <div class="max-w-[96%] w-full mx-auto px-4 flex justify-between items-center">
        <span class="text-white font-bold text-sm">LapZone Admin</span>
        <span class="text-xs">&copy; 2024 LapZone Systems</span>
    </div>
</footer>
</body>
</html>
