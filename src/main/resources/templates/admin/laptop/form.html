<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Laptop Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4" th:text="${pageTitle}"></h2>

    <form th:action="@{/admin/laptops/save}" th:object="${laptopRequest}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" th:field="*{laptopId}">

        <div class="mb-3">
            <label class="form-label">Laptop Name</label>
            <input type="text" th:field="*{laptopName}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('laptopName')}" th:errors="*{laptopName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{categoryId}" class="form-select">
                <option value="">-- Select category --</option>
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Brand</label>
            <select th:field="*{brandId}" class="form-select">
                <option value="">-- Select brand --</option>
                <option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.brandName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/laptops}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
