<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Laptop Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Laptop Details</h2>
    <div class="bg-white p-4 rounded shadow-sm">
        <p><strong>ID:</strong> <span th:text="${laptop.laptopId}"></span></p>
        <p><strong>Name:</strong> <span th:text="${laptop.laptopName}"></span></p>
        <p><strong>Description:</strong> <span th:text="${laptop.description}"></span></p>
        <p><strong>Category:</strong> <span th:text="${laptop.category != null ? laptop.category.categoryName : '—'}"></span></p>
        <p><strong>Brand:</strong> <span th:text="${laptop.brand != null ? laptop.brand.brandName : '—'}"></span></p>
        <p><strong>Created At:</strong> <span th:text="${#temporals.format(laptop.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>

        <h5 class="mt-4">Configuration Versions</h5>
        <table class="table table-sm table-bordered" th:if="${not #lists.isEmpty(laptop.configurationVersions)}">
            <thead><tr><th>CPU</th><th>RAM</th><th>Storage</th><th>GPU</th><th>Price</th><th>Stock Qty</th></tr></thead>
            <tbody>
            <tr th:each="cv : ${laptop.configurationVersions}">
                <td th:text="${cv.cpu}"></td>
                <td th:text="${cv.ram}"></td>
                <td th:text="${cv.storage}"></td>
                <td th:text="${cv.gpu ?: '—'}"></td>
                <td th:text="${#numbers.formatDecimal(cv.price, 0, 'COMMA', 0, 'POINT')}"></td>
                <td th:text="${cv.stockQuantity}"></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(laptop.configurationVersions)}" class="text-muted">No configuration versions yet.</p>

        <a th:href="@{/admin/laptops}" class="btn btn-secondary mt-3">Back</a>
        <a th:href="@{/admin/laptops/edit/{id}(id=${laptop.laptopId})}" class="btn btn-warning mt-3">Edit</a>
    </div>
</div>
</body>
</html>
