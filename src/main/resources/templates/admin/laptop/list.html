<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Laptop Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Laptop Management</h2>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="d-flex justify-content-between mb-3">
        <form th:action="@{/admin/laptops}" method="get" class="d-flex">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Search by laptop name...">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </form>
        <a th:href="@{/admin/laptops/new}" class="btn btn-success">+ Add Laptop</a>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Laptop Name</th><th>Category</th><th>Brand</th><th>Created At</th>
            <th style="width: 230px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${laptopPage.empty}">
            <td colspan="6" class="text-center text-muted">No laptops found</td>
        </tr>
        <tr th:each="laptop : ${laptopPage.content}">
            <td th:text="${laptop.laptopId}"></td>
            <td th:text="${laptop.laptopName}"></td>
            <td th:text="${laptop.category != null ? laptop.category.categoryName : '—'}"></td>
            <td th:text="${laptop.brand != null ? laptop.brand.brandName : '—'}"></td>
            <td th:text="${#temporals.format(laptop.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <a th:href="@{/admin/laptops/view/{id}(id=${laptop.laptopId})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/admin/laptops/edit/{id}(id=${laptop.laptopId})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/admin/laptops/delete/{id}(id=${laptop.laptopId})}" method="post" class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this laptop?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${laptopPage.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, laptopPage.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/admin/laptops(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
