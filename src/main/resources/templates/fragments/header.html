<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">

    <!-- Main Header -->
    <header class="bg-white border-b border-gray-200 py-3 sticky top-0 z-[100]">
        <div class="max-w-[98%] w-full mx-auto px-4 flex flex-wrap md:flex-nowrap items-center gap-4 md:gap-8">
            <a href="/" class="flex items-center gap-2 text-2xl font-extrabold tracking-wide text-gray-900">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line>
                    <line x1="15" y1="1" x2="15" y2="4"></line>
                    <line x1="9" y1="20" x2="9" y2="23"></line>
                    <line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line>
                    <line x1="20" y1="14" x2="23" y2="14"></line>
                    <line x1="1" y1="9" x2="4" y2="9"></line>
                    <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
                LapZone
            </a>

            <form action="/home-page" method="get" class="flex-1 relative max-w-[600px] w-full order-3 md:order-none">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Bạn muốn mua gì hôm nay..."
                       class="w-full py-3 pl-11 pr-4 border border-gray-200 rounded-full text-[0.95rem] focus:outline-none focus:border-blue-500 focus:ring-[3px] focus:ring-blue-500/10 transition-all bg-white text-gray-900">
            </form>

            <div class="flex items-center gap-6 ml-auto order-2 md:order-none">
                <a href="/cart"
                   class="flex items-center gap-3 text-[0.9rem] font-medium text-gray-900 hover:text-blue-600 group">
                    <div
                            class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center border border-gray-200 group-hover:bg-gray-200 transition-colors">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 0a2 2 0 100 4 2 2 0 000-4z">
                            </path>
                        </svg>
                    </div>
                    <span class="hidden sm:inline" th:text="'Giỏ hàng (' + ${cartItemCount} + ')'">Giỏ hàng</span>
                </a>

                <a href="/orders"
                   class="flex items-center gap-3 text-[0.9rem] font-medium text-gray-900 hover:text-blue-600 group">
                    <div
                            class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center border border-gray-200 group-hover:bg-gray-200 transition-colors">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                            </path>
                        </svg>
                    </div>
                    <span class="hidden sm:inline">Đơn hàng</span>
                </a>

                <div th:if="${session.user != null}"
                     class="flex items-center gap-3 text-[0.9rem] font-medium text-gray-900 group cursor-pointer relative">
                    <span class="cursor-default whitespace-nowrap">Xin chào, <span
                            th:text="${session.user.fullName}"></span></span>
                    <a href="/auth/logout"
                       class="px-4 py-1.5 rounded-md bg-red-500 text-white border border-red-500 hover:bg-red-600 transition-colors">Đăng
                        xuất</a>
                </div>

                <div th:if="${session.user == null}" class="flex items-center gap-3">
                    <a href="/auth/login"
                       class="px-4 py-1.5 rounded-md border border-gray-200 bg-white hover:bg-gray-50 text-gray-900 transition-colors">Đăng
                        nhập</a>
                    <a href="/auth/register"
                       class="px-4 py-1.5 rounded-md bg-blue-500 text-white border border-blue-500 hover:bg-blue-600 transition-colors">Đăng
                        ký</a>
                </div>
            </div>
        </div>
    </header>


    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-24 right-4 z-[1000] flex flex-col gap-2">
        <div th:if="${successMessage}" id="success-toast" class="transform transition-all duration-300 translate-x-full bg-white border-l-4 border-green-500 shadow-lg rounded-lg p-4 flex items-start gap-3 w-80">
            <svg class="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="flex-1">
                <h4 class="text-sm font-semibold text-gray-900">Thành công!</h4>
                <p class="text-sm text-gray-600 mt-1" th:text="${successMessage}"></p>
            </div>
            <button onclick="closeToast('success-toast')" class="text-gray-400 hover:text-gray-600 focus:outline-none"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        
        <div th:if="${errorMessage}" id="error-toast" class="transform transition-all duration-300 translate-x-full bg-white border-l-4 border-red-500 shadow-lg rounded-lg p-4 flex items-start gap-3 w-80">
            <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="flex-1">
                <h4 class="text-sm font-semibold text-gray-900">Lỗi!</h4>
                <p class="text-sm text-gray-600 mt-1" th:text="${errorMessage}"></p>
            </div>
            <button onclick="closeToast('error-toast')" class="text-gray-400 hover:text-gray-600 focus:outline-none"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
    </div>

    <script>
        function showToast(id) {
            const toast = document.getElementById(id);
            if (toast) {
                // Trigger reflow to ensure transition runs
                void toast.offsetWidth;
                toast.classList.remove('translate-x-full');
                
                // Auto hide after 3 seconds
                setTimeout(() => {
                    closeToast(id);
                }, 3000);
            }
        }
        
        function closeToast(id) {
            const toast = document.getElementById(id);
            if (toast) {
                toast.classList.add('translate-x-full');
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 300); // match transition duration
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            showToast('success-toast');
            showToast('error-toast');
        });
    </script>
</th:block>
</body>
</html>
