<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: head('LapZone - Quản lý Promotions')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
<aside th:replace="~{admin/admin-layout :: sidebar('promotion')}"></aside>
<div class="flex-1 flex flex-col md:ml-[280px] w-full min-h-screen">
    <header th:replace="~{admin/admin-layout :: header}"></header>
    <main class="flex-1 p-md md:p-lg lg:p-xl">
        <div class="mb-lg"><h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Quản lý Promotions</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Quản lý mã giảm giá, khuyến mãi.</p></div>
        <div th:if="${successMessage}" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg flex items-center gap-2"><span class="material-symbols-outlined">check_circle</span><span th:text="${successMessage}"></span></div>

        <div class="mb-6">
            <button onclick="document.getElementById('modal-add-promo').classList.remove('hidden')" class="px-4 py-2 bg-secondary text-on-secondary rounded-lg font-label-md hover:bg-blue-700 transition-colors flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">add</span> Thêm Promotion
            </button>
        </div>

        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl ambient-shadow overflow-hidden">
            <div class="p-6 border-b border-outline-variant"><h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2"><span class="material-symbols-outlined text-secondary">redeem</span> Danh sách Promotions <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded-full font-label-md" th:text="${#lists.size(promotions)}">0</span></h3></div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-surface-container-high"><tr>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">ID</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Mã coupon</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Tiêu đề</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Loại</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Giá trị</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Đơn tối thiểu</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Giảm tối đa</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Ngày bắt đầu</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Ngày kết thúc</th>
                        <th class="text-left p-3 font-label-md text-on-surface-variant">Thao tác</th>
                    </tr></thead>
                    <tbody>
                        <tr th:each="p : ${promotions}" class="border-b border-outline-variant hover:bg-surface-container-low transition-colors">
                            <td class="p-3 font-label-md" th:text="${p.promotionId}"></td>
                            <td class="p-3"><span class="px-2 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-label-md" th:text="${p.couponCode}"></span></td>
                            <td class="p-3" th:text="${p.title}"></td>
                            <td class="p-3" th:text="${p.discountType}"></td>
                            <td class="p-3 font-label-md" th:text="${p.discountValue}"></td>
                            <td class="p-3 font-label-md" th:text="${p.minOrderValue}"></td>
                            <td class="p-3 font-label-md" th:text="${p.maxDiscountAmount}"></td>
                            <td class="p-3 font-label-md" th:text="${#temporals.format(p.startDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="p-3 font-label-md" th:text="${#temporals.format(p.endDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="p-3">
                                <form th:action="@{/admin/promotions/delete/{id}(id=${p.promotionId})}" method="POST" class="inline" onsubmit="return confirm('Xóa Promotion này?');">
                                    <button type="submit" class="text-red-600 border border-red-200 bg-transparent hover:bg-red-50 px-2 py-1 rounded-full transition-colors inline-flex items-center gap-1 text-xs">
                                        <span class="material-symbols-outlined text-[14px]">delete</span>Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promotions)}"><td colspan="10" class="p-8 text-center text-on-surface-variant">Chưa có Promotion nào.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<!-- Modal Add -->
<div id="modal-add-promo" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest rounded-xl p-6 w-full max-w-lg shadow-xl border border-outline-variant max-h-[90vh] overflow-y-auto">
        <h3 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-secondary">add_circle</span> Thêm Promotion</h3>
        <form th:action="@{/admin/promotions/create}" method="POST">
            <div class="space-y-3">
                <div><label class="block font-label-md text-on-surface-variant mb-1">Mã coupon</label><input type="text" name="couponCode" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                <div><label class="block font-label-md text-on-surface-variant mb-1">Tiêu đề</label><input type="text" name="title" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Loại giảm giá</label>
                        <select name="discountType" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest">
                            <option value="PERCENTAGE">Phần trăm (%)</option><option value="FIXED">Cố định (VND)</option>
                        </select></div>
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Giá trị</label><input type="number" name="discountValue" required step="0.01" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Đơn tối thiểu</label><input type="number" name="minOrderValue" step="0.01" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Giảm tối đa</label><input type="number" name="maxDiscountAmount" step="0.01" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Ngày bắt đầu</label><input type="datetime-local" name="startDate" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                    <div><label class="block font-label-md text-on-surface-variant mb-1">Ngày kết thúc</label><input type="datetime-local" name="endDate" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 bg-secondary text-on-secondary py-2.5 rounded-lg font-label-md hover:bg-blue-700 transition-colors">Thêm</button>
                <button type="button" onclick="document.getElementById('modal-add-promo').classList.add('hidden')" class="flex-1 border border-outline-variant text-on-surface py-2.5 rounded-lg font-label-md hover:bg-surface-container-high transition-colors">Hủy</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
