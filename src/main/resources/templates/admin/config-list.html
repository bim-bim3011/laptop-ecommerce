<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: head('LapZone - Quản lý Laptop Configs')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
<aside th:replace="~{admin/admin-layout :: sidebar('laptop')}"></aside>
<div class="flex-1 flex flex-col md:ml-[280px] w-full min-h-screen">
    <header th:replace="~{admin/admin-layout :: header}"></header>
    <main class="flex-1 p-md md:p-lg lg:p-xl">
        <div class="mb-4"><a th:href="@{/admin/laptops}" class="text-secondary hover:text-blue-700 transition-colors font-label-md flex items-center gap-1 w-fit"><span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại Laptops</a></div>
        <div class="mb-lg">
            <h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Quản lý Laptop Configs</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Quản lý các cấu hình (CPU, RAM, Storage...) cho từng Laptop.</p>
        </div>
        <div th:if="${successMessage}" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg flex items-center gap-2">
            <span class="material-symbols-outlined">check_circle</span><span th:text="${successMessage}"></span>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-gutter">
            <!-- Form thêm mới -->
            <div class="xl:col-span-1">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 ambient-shadow">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-secondary">add_circle</span> Thêm Config mới</h3>
                    <form th:action="@{/admin/laptops/configs/create}" method="POST">
                        <div class="space-y-3">
                            <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">Laptop</label>
                                <select name="laptopId" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest">
                                    <option value="">Chọn Laptop</option>
                                    <option th:each="l : ${laptops}" th:value="${l.laptopId}" th:text="${l.laptopName}"></option>
                                </select></div>
                            <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">CPU</label>
                                <input type="text" name="cpu" required minlength="2" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="Intel i7-13700H"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">RAM</label>
                                    <input type="text" name="ram" required pattern=".*(GB|TB|gb|tb).*" title="Vui lòng bao gồm dung lượng (GB hoặc TB)" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="16GB"></div>
                                <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">Storage</label>
                                    <input type="text" name="storage" required pattern=".*(GB|TB|gb|tb).*" title="Vui lòng bao gồm dung lượng (GB hoặc TB)" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="512GB SSD"></div>
                            </div>
                            <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">GPU</label>
                                <input type="text" name="gpu" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="RTX 4060"></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">Giá (VND)</label>
                                    <input type="number" name="price" required min="1000" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="25000000"></div>
                                <div><label class="block font-label-md text-label-md text-on-surface-variant mb-1">Số lượng</label>
                                    <input type="number" name="stockQuantity" required min="0" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="10"></div>
                            </div>
                        </div>
                        <button type="submit" class="w-full mt-4 bg-secondary text-on-secondary py-2.5 rounded-lg font-label-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-sm">add</span> Thêm Config
                        </button>
                    </form>
                </div>
            </div>

            <!-- Bảng danh sách -->
            <div class="xl:col-span-2">
                <!-- Bộ lọc -->
                <form th:action="@{/admin/laptops/configs}" method="get" class="mb-4 bg-surface-container-lowest p-4 rounded-xl border border-outline-variant ambient-shadow flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[150px]">
                        <label for="keyword" class="block font-label-md text-label-md text-on-surface-variant mb-1">Tìm Tên Laptop</label>
                        <input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="VD: Macbook..." class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-sm">
                    </div>
                    <div class="w-28">
                        <label for="cpu" class="block font-label-md text-label-md text-on-surface-variant mb-1">CPU</label>
                        <select id="cpu" name="cpu" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-sm">
                            <option value="">Tất cả</option>
                            <option th:each="c : ${distinctCpus}" th:value="${c}" th:text="${c}" th:selected="${c == cpu}"></option>
                        </select>
                    </div>
                    <div class="w-28">
                        <label for="ram" class="block font-label-md text-label-md text-on-surface-variant mb-1">RAM</label>
                        <select id="ram" name="ram" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-sm">
                            <option value="">Tất cả</option>
                            <option th:each="r : ${distinctRams}" th:value="${r}" th:text="${r}" th:selected="${r == ram}"></option>
                        </select>
                    </div>
                    <div class="w-28">
                        <label for="storage" class="block font-label-md text-label-md text-on-surface-variant mb-1">Storage</label>
                        <select id="storage" name="storage" class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary text-sm">
                            <option value="">Tất cả</option>
                            <option th:each="s : ${distinctStorages}" th:value="${s}" th:text="${s}" th:selected="${s == storage}"></option>
                        </select>
                    </div>
                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">
                    <input type="hidden" name="pageNo" value="1">
                    <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded-lg font-label-md hover:bg-primary/90 transition-colors flex items-center gap-1 text-sm">
                        <span class="material-symbols-outlined text-[18px]">filter_alt</span> Lọc
                    </button>
                    <a th:href="@{/admin/laptops/configs}" class="px-4 py-2 border border-outline-variant text-on-surface rounded-lg font-label-md hover:bg-surface-container-low transition-colors flex items-center gap-1 text-sm">
                        <span class="material-symbols-outlined text-[18px]">restart_alt</span>
                    </a>
                </form>

                <div class="bg-surface-container-lowest border border-outline-variant rounded-xl ambient-shadow overflow-hidden">
                    <div class="p-6 border-b border-outline-variant">
                        <h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2">
                            <span class="material-symbols-outlined text-secondary">memory</span> Danh sách Configs
                            <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded-full font-label-md" th:text="${totalItems != null ? totalItems : #lists.size(configs)}">0</span>
                        </h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-surface-container-high">
                                <tr>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='configurationId', sortDir=${sortField == 'configurationId' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            ID <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'configurationId' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='laptop.laptopName', sortDir=${sortField == 'laptop.laptopName' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            Laptop <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'laptop.laptopName' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='cpu', sortDir=${sortField == 'cpu' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            CPU <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'cpu' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='ram', sortDir=${sortField == 'ram' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            RAM <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'ram' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='storage', sortDir=${sortField == 'storage' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            Storage <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'storage' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">GPU</th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='price', sortDir=${sortField == 'price' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            Giá <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'price' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">
                                        <a th:href="@{/admin/laptops/configs(pageNo=${currentPage}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField='stockQuantity', sortDir=${sortField == 'stockQuantity' ? reverseSortDir : 'asc'})}" class="flex items-center gap-1 hover:text-primary transition-colors">
                                            SL <span class="material-symbols-outlined text-[14px]" th:text="${sortField == 'stockQuantity' ? (sortDir == 'asc' ? 'arrow_upward' : 'arrow_downward') : 'swap_vert'}"></span>
                                        </a>
                                    </th>
                                    <th class="text-left p-3 font-label-md text-label-md text-on-surface-variant">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cfg : ${configs}" class="border-b border-outline-variant hover:bg-surface-container-low transition-colors">
                                    <td class="p-3 font-label-md" th:text="${cfg.configurationId}"></td>
                                    <td class="p-3" th:text="${cfg.laptop != null ? cfg.laptop.laptopName : 'N/A'}"></td>
                                    <td class="p-3" th:text="${cfg.cpu}"></td>
                                    <td class="p-3" th:text="${cfg.ram}"></td>
                                    <td class="p-3" th:text="${cfg.storage}"></td>
                                    <td class="p-3" th:text="${cfg.gpu ?: 'N/A'}"></td>
                                    <td class="p-3 font-label-md" th:text="${#numbers.formatDecimal(cfg.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                                    <td class="p-3" th:text="${cfg.stockQuantity}"></td>
                                    <td class="p-3">
                                        <div class="flex items-center gap-1">
                                            <form th:action="@{/admin/laptops/configs/delete/{id}(id=${cfg.configurationId})}" method="POST" class="inline" onsubmit="return confirm('Xóa Config này?');">
                                                <button type="submit" class="text-red-600 border border-red-200 bg-transparent hover:bg-red-50 px-2 py-1 rounded-full transition-colors inline-flex items-center gap-1 text-xs">
                                                    <span class="material-symbols-outlined text-[14px]">delete</span>Xóa
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(configs)}"><td colspan="9" class="p-8 text-center text-on-surface-variant">Chưa có Config nào.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Phân trang -->
                <div th:if="${totalPages > 1}" class="mt-4 p-4 rounded-xl border border-outline-variant flex items-center justify-between bg-surface-container-lowest ambient-shadow">
                    <div class="text-sm text-on-surface-variant">
                        Trang <span class="font-medium text-on-surface" th:text="${currentPage}">1</span> 
                        / <span class="font-medium text-on-surface" th:text="${totalPages}">1</span>
                        (<span th:text="${totalItems}">0</span> Configs)
                    </div>
                    <div class="flex items-center gap-1">
                        <a th:if="${currentPage > 1}" th:href="@{/admin/laptops/configs(pageNo=${currentPage - 1}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField=${sortField}, sortDir=${sortDir})}" 
                           class="px-3 py-1 border border-outline-variant rounded-md hover:bg-surface-container-low text-sm font-medium transition-colors">Trước</a>
                        
                        <span th:each="i: ${#numbers.sequence(1, totalPages)}">
                            <a th:if="${i != currentPage}" th:href="@{/admin/laptops/configs(pageNo=${i}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField=${sortField}, sortDir=${sortDir})}"
                               class="px-3 py-1 border border-outline-variant rounded-md hover:bg-surface-container-low text-sm font-medium transition-colors" th:text="${i}"></a>
                            <span th:if="${i == currentPage}" class="px-3 py-1 bg-primary text-on-primary rounded-md text-sm font-medium" th:text="${i}"></span>
                        </span>
                        
                        <a th:if="${currentPage < totalPages}" th:href="@{/admin/laptops/configs(pageNo=${currentPage + 1}, keyword=${keyword}, cpu=${cpu}, ram=${ram}, storage=${storage}, sortField=${sortField}, sortDir=${sortDir})}" 
                           class="px-3 py-1 border border-outline-variant rounded-md hover:bg-surface-container-low text-sm font-medium transition-colors">Sau</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
