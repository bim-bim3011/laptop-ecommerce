<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/admin-layout :: head('LapZone - Quản lý Gift Items')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex">
<aside th:replace="~{admin/admin-layout :: sidebar('gift-item')}"></aside>
<div class="flex-1 flex flex-col md:ml-[280px] w-full min-h-screen">
    <header th:replace="~{admin/admin-layout :: header}"></header>
    <main class="flex-1 p-md md:p-lg lg:p-xl">
        <div class="mb-lg"><h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Quản lý Gift Items</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Quản lý các quà tặng kèm theo sản phẩm.</p></div>
        <div th:if="${successMessage}" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg flex items-center gap-2"><span class="material-symbols-outlined">check_circle</span><span th:text="${successMessage}"></span></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-gutter">
            <div class="lg:col-span-1">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 ambient-shadow">
                    <h3 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-secondary">add_circle</span> Thêm Gift Item</h3>
                    <form th:action="@{/admin/gift-items/create}" method="POST">
                        <div class="space-y-3">
                            <div><label class="block font-label-md text-on-surface-variant mb-1">Tên quà tặng</label>
                                <input type="text" name="itemName" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="Chuột không dây..."></div>
                            <div><label class="block font-label-md text-on-surface-variant mb-1">Mô tả</label>
                                <textarea name="description" rows="2" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></textarea></div>
                            <div><label class="block font-label-md text-on-surface-variant mb-1">Giá (VND)</label>
                                <input type="number" name="price" step="0.01" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest" placeholder="500000"></div>
                        </div>
                        <button type="submit" class="w-full mt-4 bg-secondary text-on-secondary py-2.5 rounded-lg font-label-md hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-sm">add</span> Thêm Gift Item
                        </button>
                    </form>
                </div>
            </div>
            <div class="lg:col-span-2">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-xl ambient-shadow overflow-hidden">
                    <div class="p-6 border-b border-outline-variant"><h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-2"><span class="material-symbols-outlined text-secondary">featured_play_list</span> Danh sách Gift Items <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs rounded-full font-label-md" th:text="${#lists.size(giftItems)}">0</span></h3></div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-surface-container-high"><tr>
                                <th class="text-left p-4 font-label-md text-on-surface-variant">ID</th>
                                <th class="text-left p-4 font-label-md text-on-surface-variant">Tên</th>
                                <th class="text-left p-4 font-label-md text-on-surface-variant">Giá</th>
                                <th class="text-left p-4 font-label-md text-on-surface-variant">Thao tác</th>
                            </tr></thead>
                            <tbody>
                                <tr th:each="g : ${giftItems}" class="border-b border-outline-variant hover:bg-surface-container-low transition-colors">
                                    <td class="p-4 font-label-md" th:text="${g.giftItemId}"></td>
                                    <td class="p-4" th:text="${g.itemName}"></td>
                                    <td class="p-4 font-label-md" th:text="${g.price != null ? #numbers.formatDecimal(g.price, 0, 'COMMA', 0, 'POINT') + ' ₫' : 'N/A'}"></td>
                                    <td class="p-4 flex items-center gap-2">
                                        <button type="button" th:data-id="${g.giftItemId}" th:data-name="${g.itemName}" th:data-desc="${g.description ?: ''}" th:data-price="${g.price ?: 0}" onclick="openEditGift(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-desc'), this.getAttribute('data-price'))"
                                                class="text-blue-600 border border-blue-200 bg-transparent hover:bg-blue-50 px-3 py-1 rounded-full transition-colors inline-flex items-center gap-1">
                                            <span class="material-symbols-outlined text-[16px]">edit</span><span class="text-sm font-medium">Edit</span>
                                        </button>
                                        <form th:action="@{/admin/gift-items/delete/{id}(id=${g.giftItemId})}" method="POST" class="inline" onsubmit="return confirm('Xóa Gift Item này?');">
                                            <button type="submit" class="text-red-600 border border-red-200 bg-transparent hover:bg-red-50 px-3 py-1 rounded-full transition-colors inline-flex items-center gap-1">
                                                <span class="material-symbols-outlined text-[16px]">delete</span><span class="text-sm font-medium">Delete</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(giftItems)}"><td colspan="4" class="p-8 text-center text-on-surface-variant">Chưa có Gift Item nào.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<!-- Modal Edit -->
<div id="modal-edit-gift" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-surface-container-lowest rounded-xl p-6 w-full max-w-md shadow-xl border border-outline-variant">
        <h3 class="font-headline-md text-headline-md text-on-surface mb-6 flex items-center gap-2"><span class="material-symbols-outlined text-secondary">edit</span> Chỉnh sửa Gift Item</h3>
        <form id="editGiftForm" method="POST">
            <div class="space-y-3">
                <div><label class="block font-label-md text-on-surface-variant mb-1">Tên</label><input type="text" id="editGiftName" name="itemName" required class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
                <div><label class="block font-label-md text-on-surface-variant mb-1">Mô tả</label><textarea id="editGiftDesc" name="description" rows="2" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></textarea></div>
                <div><label class="block font-label-md text-on-surface-variant mb-1">Giá</label><input type="number" id="editGiftPrice" name="price" step="0.01" class="w-full border border-outline-variant rounded-lg px-4 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-secondary bg-surface-container-lowest"></div>
            </div>
            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 bg-secondary text-on-secondary py-2.5 rounded-lg font-label-md hover:bg-blue-700 transition-colors">Lưu</button>
                <button type="button" onclick="document.getElementById('modal-edit-gift').classList.add('hidden')" class="flex-1 border border-outline-variant text-on-surface py-2.5 rounded-lg font-label-md hover:bg-surface-container-high transition-colors">Hủy</button>
            </div>
        </form>
    </div>
</div>
<script>
    function openEditGift(id, name, desc, price) {
        document.getElementById('editGiftName').value = name;
        document.getElementById('editGiftDesc').value = desc;
        document.getElementById('editGiftPrice').value = price;
        document.getElementById('editGiftForm').action = '/admin/gift-items/update/' + id;
        document.getElementById('modal-edit-gift').classList.remove('hidden');
    }
</script>
</body>
</html>
