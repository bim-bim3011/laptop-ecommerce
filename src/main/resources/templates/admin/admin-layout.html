<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title}">Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Hanken+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "on-error": "#ffffff", "on-secondary": "#ffffff", "surface-tint": "#585e6e",
                        "surface": "#f7f9fb", "tertiary": "#735c00", "surface-dim": "#d8dadc",
                        "on-surface-variant": "#45474c", "error": "#ba1a1a", "primary": "#000000",
                        "primary-container": "#151c29", "on-surface": "#191c1e",
                        "tertiary-container": "#cea700", "background": "#f7f9fb",
                        "surface-container-lowest": "#ffffff", "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6", "surface-container-low": "#f2f4f6",
                        "on-primary": "#ffffff", "outline-variant": "#c6c6cc",
                        "on-secondary-container": "#fefcff", "surface-bright": "#f7f9fb",
                        "secondary-container": "#2170e4", "outline": "#76777c",
                        "surface-container-high": "#e6e8ea", "surface-container": "#eceef0",
                        "secondary": "#0058be", "surface-container-highest": "#e0e3e5"
                    },
                    spacing: {
                        "gutter": "24px", "md": "24px", "xs": "8px", "base": "4px",
                        "xl": "48px", "sm": "16px", "lg": "32px", "sidebar-width": "280px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"], "label-md": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"], "body-lg": ["Inter"],
                        "headline-md": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ambient-shadow { box-shadow: 0 4px 8px rgba(0,0,0,0.05); transition: all 0.3s ease-in-out; }
        .ambient-shadow:hover { box-shadow: 0 10px 20px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .nav-link { transition: all 0.2s ease-in-out; }
        .nav-link:hover { transform: translateX(4px); }
    </style>
</head>

<body>
<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(activeMenu)" class="hidden md:flex flex-col bg-surface-container-lowest border-r border-outline-variant fixed left-0 top-0 h-full w-[280px] z-20 shadow-[1px_0_10px_rgba(0,0,0,0.02)]">
    <div class="p-md border-b border-outline-variant">
        <h1 class="font-headline-md text-headline-md font-bold text-primary">LapZone</h1>
        <p class="font-label-md text-label-md text-on-surface-variant mt-xs">Admin Dashboard</p>
    </div>
    <nav class="flex-1 py-md px-sm overflow-y-auto flex flex-col gap-2">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${activeMenu == 'overview'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">dashboard</span> Overview
        </a>
        <a th:href="@{/admin/brands}"
           th:classappend="${activeMenu == 'brand'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">branding_watermark</span> Brand
        </a>
        <a th:href="@{/admin/categories}"
           th:classappend="${activeMenu == 'category'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">category</span> Category
        </a>
        <a th:href="@{/admin/laptops}"
           th:classappend="${activeMenu == 'laptop'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">laptop_mac</span> Laptops
        </a>
        <a th:href="@{/admin/orders}"
           th:classappend="${activeMenu == 'orders'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">receipt_long</span> Orders
        </a>

        <a th:href="@{/admin/users}"
           th:classappend="${activeMenu == 'user'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">group</span> User Management
        </a>
        <a th:href="@{/admin/promotions}"
           th:classappend="${activeMenu == 'promotion'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">redeem</span> Promotions
        </a>
        <a th:href="@{/admin/gift-items}"
           th:classappend="${activeMenu == 'gift-item'} ? 'bg-blue-500 text-white' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface'"
           class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg font-body-md text-body-md">
            <span class="material-symbols-outlined">featured_play_list</span> Gift Items
        </a>
    </nav>
    <div class="p-md border-t border-outline-variant flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold font-label-md">AU</div>
        <div>
            <p class="font-label-md text-label-md font-bold text-on-surface">Admin User</p>
            <p class="text-xs text-on-surface-variant">admin@lapzone.com</p>
        </div>
        <a th:href="@{/admin/logout}" class="ml-auto text-on-surface-variant hover:text-error transition-colors" title="Đăng xuất">
            <span class="material-symbols-outlined">logout</span>
        </a>
    </div>
</aside>

<!-- Header Fragment -->
<header th:fragment="header" class="bg-surface/80 backdrop-blur-md border-b border-outline-variant h-16 sticky top-0 z-10 flex justify-between items-center px-lg">
    <div class="flex items-center flex-1"></div>
    <div class="flex items-center gap-4">
        <button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full animate-pulse"></span>
        </button>
        <button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all">
            <span class="material-symbols-outlined">settings</span>
        </button>
    </div>
</header>
</body>
</html>
